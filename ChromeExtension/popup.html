<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>AI Usage Bar</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  body { width: 310px; margin: 0; padding: 20px; font-size: 13px; line-height: 1.55; }
  h1 { font-size: 17px; margin: 0 0 10px; }
  p { margin: 8px 0; }
  label { display: block; font-size: 12px; opacity: .7; margin-top: 14px; }
  input { width: 100%; box-sizing: border-box; padding: 7px 8px; margin-top: 5px;
          border: 1px solid #8886; border-radius: 8px; font: inherit; font-size: 12px; }
  #hint { font-size: 11px; opacity: .7; margin: 5px 0 0; }
  #result { font-weight: 600; margin: 16px 0; }
  button { width: 100%; padding: 9px; margin-top: 7px; border: 1px solid #8886; border-radius: 8px; cursor: pointer; }
  small { display: block; opacity: .7; margin-top: 14px; }
</style>
<h1 data-i18n="popupTitle"></h1>
<p data-i18n="popupIntro"></p>
<label><input style="width:auto" type="checkbox" id="auto-refresh"> <span data-i18n="autoRefreshLabel"></span></label>
<small data-i18n="autoRefreshNote"></small>
<section><label><input style="width:auto" type="checkbox" id="claude-enabled"> <span data-i18n="claudeEnable"></span></label>
<p id="claude-result"></p><button id="claude-refresh" data-i18n="claudeRefresh"></button><button id="claude-page" data-i18n="claudePage"></button></section>
<section><label><input style="width:auto" type="checkbox" id="codex-enabled"> <span data-i18n="codexEnable"></span></label>
<p id="codex-result"></p><button id="codex-refresh" data-i18n="codexRefresh"></button><button id="codex-page" data-i18n="codexPage"></button></section>
<hr><h2>Gemini</h2>
<p id="result" data-i18n="geminiChecking"></p>
<label for="account" data-i18n="accountLabel"></label>
<input id="account" type="email" autocomplete="off" spellcheck="false" data-i18n-placeholder="accountPlaceholder">
<p id="hint"></p>
<button id="refresh" data-i18n="refreshNow"></button>
<button id="usage" data-i18n="openUsagePage"></button>
<small data-i18n="footnote"></small>
<script src="i18n.js"></script>
<script src="parser.js"></script>
<script src="popup.js"></script>
<script src="web-parser.js"></script>
<script src="web-popup.js"></script>
</html>
